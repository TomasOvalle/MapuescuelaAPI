services:
  postgres:
    image: postgres:16-alpine
    container_name: mapuescuela-postgres
    environment:
      POSTGRES_DB: mapuescuela
      POSTGRES_USER: mapuescuela
      POSTGRES_PASSWORD: mapuescuela_dev
    ports:
      - "5432:5432"
    volumes:
      - mapuescuela_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mapuescuela -d mapuescuela"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mapuescuela_postgres_data:
